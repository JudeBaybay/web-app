<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>For Isha</title>
    <link rel="icon" type="image/png" href="../assets/favicon.png">
    <link rel="stylesheet" href="css/style.css" />
  </head>

  <body class="landing-page">
    <div class="emoji-waterfall" aria-hidden="true"></div>
    <main class="phone-screen">
      <div class="invitation-container">
        <div id="sadCatBox" class="sad-cat-box hidden">
          <div class="sad-cat-container">
            <img id="sadCatImage" src="assets/sad-cat-1.jpg" alt="Sad cat" />
          </div>
        </div>

        <section class="landing-card">
          <h1 class="question-title">
            May I have the pleasure of<br />
            taking you on a<br />
            date with me?
          </h1>

          <div class="answer-container">
            <button
              type="button"
              id="yesButton"
              class="answer-button yes-button"
            >
              YES
            </button>

            <button type="button" id="noButton" class="answer-button no-button">
              NO
            </button>
          </div>
        </section>
      </div>
    </main>

    <script src="js/emoji-waterfall.js"></script>
    <script src="js/index.js"></script>
  </body>
</html>
